
name: Import WindUI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ArioUI
        uses: actions/checkout@v4

      - name: Download official WindUI
        run: |
          curl -fL \
            https://github.com/Footagesus/WindUI/archive/refs/heads/main.zip \
            -o /tmp/windui.zip
          unzip -q /tmp/windui.zip -d /tmp

      - name: Copy WindUI without replacing existing files
        run: |
          set -eu

          if [ -e vendor/WindUI ]; then
            echo "vendor/WindUI already exists."
            echo "Stopping to protect existing files."
            exit 1
          fi

          mkdir -p vendor
          cp -R /tmp/WindUI-main vendor/WindUI

          test -f vendor/WindUI/LICENSE

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/WindUI
          git commit -m "Import WindUI source with MIT license"
          
